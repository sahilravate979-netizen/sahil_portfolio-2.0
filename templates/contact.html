<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Sahil Ravate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Sahil Ravate
        </div>

        <ul class="nav-links">

            <li>
                <a href="{{ url_for('index') }}">
                    Home
                </a>
            </li>

            <li>
                <a href="{{ url_for('index') }}#about">
                    About
                </a>
            </li>

            <li>
                <a href="{{ url_for('index') }}#skills">
                    Skills
                </a>
            </li>

            <li>
                <a href="{{ url_for('projects') }}">
                    Projects
                </a>
            </li>

        </ul>

    </nav>


    <section class="contact-page">

        <div class="contact-box">

            <h1>
                Contact Me
            </h1>

            <p>
                Send me a message using the form below.
            </p>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form method="POST"
                  action="{{ url_for('contact') }}">

                <label>
                    Name
                </label>

                <input type="text"
                       name="name"
                       placeholder="Enter your name"
                       required>


                <label>
                    Email
                </label>

                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>


                <label>
                    Message
                </label>

                <textarea name="message"
                          rows="6"
                          placeholder="Enter your message"
                          required></textarea>


                <button type="submit"
                        class="btn">

                    Send Message

                </button>

            </form>

        </div>

    </section>


    <footer>

        <p>
            © 2026 Sahil Ravate
        </p>

    </footer>


</body>

</html>
